# Optional free Render web service. The documented host is Vercel Hobby
# (vercel.json). This file does not create a database.
# npm run build applies migrations when DATABASE_URL is set, and copies it
# into DATABASE_URL_UNPOOLED when that variable is absent.

services:
  - type: web
    name: sms-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: RUN_MIGRATIONS
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
